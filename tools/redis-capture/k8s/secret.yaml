# Users and passwords. Example values: in a real cluster create this Secret from your secret store,
# never commit it. The ACL file holds only SHA-256 hashes; the plain passwords are for the pods that log in.
apiVersion: v1
kind: Secret
metadata:
  name: redis-users
  labels:
    app.kubernetes.io/name: redis
type: Opaque
stringData:
  users.acl: |
    user default off
    user admin on #74f6fa38c56a33058e98352449081570b0815ae2c3483a9375cfa8f64125eb08 ~* &* +@all
    user app on #2495246078ebb2ad41f769ae982e80d096cc0dbf012aedb061a5f3c66a25ceaa ~orders:* ~users:* &orders.* +@all -@admin -@dangerous
    user replication on #36088691292de99c7169f769e89fbddb3a2d842996dd4abb709c5d45f15354fe +psync +replconf +ping
    user probe on #7bb8071cd0c5aa0475c86a6b4f40c0885dbb097a048143e951143ce4588f335d +ping +info
    user backup on #6a8d62695b493bd574b1c81ac724b45ca12fa98fa34e9d8da0965bfb89084a74 +sync +replconf +ping
  REPLICATION_PASSWORD: example-replication-password
  PROBE_PASSWORD: example-probe-password
  BACKUP_PASSWORD: example-backup-password
