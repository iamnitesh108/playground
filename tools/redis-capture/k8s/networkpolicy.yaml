# Only the Redis pods themselves (replication) and pods labelled redis-client=true may reach port 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
        - podSelector:
            matchLabels:
              redis-client: "true"
      ports:
        - protocol: TCP
          port: 6379
