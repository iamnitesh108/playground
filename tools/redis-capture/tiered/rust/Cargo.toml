[package]
name = "tiered-cache"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
