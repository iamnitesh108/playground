plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'io.lettuce:lettuce-core:6.4.0.RELEASE'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'basics.Main'
}
