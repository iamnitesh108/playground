# One RustFS server with its data in a named volume.
#   podman compose up -d        (or: docker compose up -d)
services:
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: s3-lab-compose
    ports:
      - "${S3_API_PORT:-9000}:9000"       # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-labadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-labsecret123}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  data:
