; PgBouncer for the operations recordings. The server is the pg-ops container, reached from
; the pg-ops-bouncer container through the host.
[databases]
shop           = host=host.containers.internal port=55520 dbname=shop
shop_single    = host=host.containers.internal port=55520 dbname=shop pool_size=1
shop_session   = host=host.containers.internal port=55520 dbname=shop pool_mode=session
shop_statement = host=host.containers.internal port=55520 dbname=shop pool_mode=statement
shop_bench     = host=host.containers.internal port=55520 dbname=shop pool_size=8

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pooladmin
pool_mode = transaction
default_pool_size = 2
max_client_conn = 200
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
