plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.zaxxer:HikariCP:5.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'demo.start.UsageDemo'
}
